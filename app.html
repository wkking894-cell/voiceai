<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>语音AI - 智能助手</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e1a;color:#e2e8f0;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:rgba(15,23,42,0.7);border-left:1px solid rgba(56,189,248,0.12);border-right:1px solid rgba(56,189,248,0.12)}
@media(min-width:768px){.app{margin:20px auto;height:calc(100vh-40px);border-radius:24px;border:1px solid rgba(56,189,248,0.12);box-shadow:0 0 80px rgba(56,189,248,0.04)}}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px 16px;border-bottom:1px solid rgba(56,189,248,0.12);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:bold;box-shadow:0 0 12px rgba(56,189,248,0.3)}
.title{font-size:16px;font-weight:700;background:linear-gradient(135deg,#e2e8f0,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.status-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;margin-left:4px}
.status-dot.thinking{background:#f59e0b;box-shadow:0 0 6px #f59e0b;animation:pulse .6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.btn-icon{width:34px;height:34px;border:none;border-radius:8px;background:transparent;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.btn-icon:active{background:rgba(56,189,248,0.1)}
.chat{flex:1;overflow-y:auto;padding:12px 10px;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.15);border-radius:2px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:10px;padding:20px}
.welcome .icon{font-size:44px;margin-bottom:4px;opacity:.7}
.welcome h2{font-size:18px;font-weight:600;color:#38bdf8}
.welcome p{color:#64748b;font-size:13px;line-height:1.6;max-width:300px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;padding:0 10px}
.chip{padding:8px 14px;border:1px solid rgba(56,189,248,0.12);border-radius:18px;background:rgba(56,189,248,0.04);color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;touch-action:manipulation}
.chip:active{background:rgba(56,189,248,0.12);border-color:#38bdf8;color:#38bdf8}
.msg{display:flex;gap:8px;margin-bottom:14px;animation:msgIn .25s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.avatar.user{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff}
.avatar.ai{background:rgba(56,189,248,0.1);color:#38bdf8;border:1px solid rgba(56,189,248,0.12)}
.bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bubble{background:rgba(30,41,59,0.8);color:#e2e8f0;border:1px solid rgba(56,189,248,0.08);border-bottom-left-radius:4px}
.thinking-dots{display:flex;gap:4px;padding:5px 0}
.thinking-dots span{width:7px;height:7px;border-radius:50%;background:#38bdf8;animation:dot 1.2s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.typing-cursor{display:inline-block;width:2px;height:1em;background:#38bdf8;margin-left:2px;animation:cur .8s step-end infinite;vertical-align:text-bottom}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.input-area{display:flex;align-items:center;gap:6px;padding:10px 8px 16px;border-top:1px solid rgba(56,189,248,0.12);flex-shrink:0}
.input-box{flex:1;display:flex;align-items:center;gap:6px;background:rgba(30,41,59,0.6);border:1px solid rgba(56,189,248,0.12);border-radius:22px;padding:0 3px 0 14px;transition:all .2s}
.input-box:focus-within{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,0.06)}
.text-input{flex:1;border:none;background:transparent;color:#e2e8f0;font-size:15px;font-family:inherit;outline:none;padding:9px 0;min-width:0}
.text-input::placeholder{color:#475569;font-size:14px}
.send-btn{width:34px;height:34px;border:none;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:all .15s}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.3}
.mic-btn{width:42px;height:42px;border:none;border-radius:50%;background:rgba(30,41,59,0.6);border:1px solid rgba(56,189,248,0.08);color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:all .15s}
.hint{text-align:center;color:#475569;font-size:11px;padding:2px 0 4px;flex-shrink:0}
@media(max-width:400px){
  .bubble{max-width:88%;font-size:13px}
  .chip{font-size:12px;padding:6px 12px}
  .welcome h2{font-size:16px}
  .input-area{padding:8px 6px 14px}
  .text-input{font-size:14px;padding:8px 0}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">V</div>
      <span class="title">语音AI</span>
      <span class="status-dot" id="statusDot"></span>
    </div>
    <button class="btn-icon" id="clearBtn" onclick="clearChat()">&#x1F5D1;</button>
  </div>
  <div class="chat" id="chatArea">
    <div class="welcome" id="welcomeMsg">
      <div class="icon">&#x1F3A4;</div>
      <h2>你好！我是语音AI</h2>
      <p>输入文字或点击下方按钮开始对话</p>
      <div class="chips">
        <button class="chip" onclick="ask(this)">今天天气</button>
        <button class="chip" onclick="ask(this)">旅游规划</button>
        <button class="chip" onclick="ask(this)">当前时间</button>
        <button class="chip" onclick="ask(this)">有点难过</button>
        <button class="chip" onclick="ask(this)">考试没考好</button>
        <button class="chip" onclick="ask(this)">给我鼓励</button>
      </div>
    </div>
  </div>
  <div class="hint" id="inputHint">输入你想说的话，按 Enter 发送</div>
  <div class="input-area">
    <button class="mic-btn" id="micBtn" title="语音功能需要HTTPS">&#x1F3A4;</button>
    <div class="input-box">
      <input type="text" class="text-input" id="textInput" placeholder="输入你的问题..." autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="sendText()">&#x27A4;</button>
    </div>
  </div>
</div>
<script>
(function(){
  var ca=document.getElementById('chatArea');
  var wm=document.getElementById('welcomeMsg');
  var ti=document.getElementById('textInput');
  var mBtn=document.getElementById('micBtn');
  var ih=document.getElementById('inputHint');
  var sd=document.getElementById('statusDot');
  var proc=false;
  var te=null;
  var sy=window.speechSynthesis;
  var rec=null;
  var lis=false;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR&&location.protocol!=='file:'){
    try{
      rec=new SR();rec.lang='zh-CN';rec.continuous=false;rec.interimResults=true;
      rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t=e.results[i][0].transcript}if(t){ti.value=t;sendText()}};
      rec.onerror=function(e){if(e.error==='no-speech'||e.error==='aborted')return;lis=false;if(!proc)setStatus('idle');ih.textContent='语音错误，试试文字输入'};
      rec.onend=function(){lis=false;if(!proc)setStatus('idle')};
    }catch(e){}
  }
  function setStatus(m){
    sd.className='status-dot';
    if(m==='think'){sd.classList.add('thinking');ih.textContent='AI正在思考...'}
    else{ih.textContent='输入你想说的话，按 Enter 发送'}
  }
  function sb(){requestAnimationFrame(function(){ca.scrollTop=ca.scrollHeight})}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  function addUser(t){
    wm.style.display='none';
    var d=document.createElement('div');d.className='msg user';
    d.innerHTML='<div class="avatar user">你</div><div class="bubble">'+esc(t)+'</div>';
    ca.appendChild(d);sb();
  }
  function remT(){if(te){te.remove();te=null}}
  function showT(){
    wm.style.display='none';remT();
    var d=document.createElement('div');d.className='msg ai';
    d.innerHTML='<div class="avatar ai">V</div><div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>';
    ca.appendChild(d);te=d;sb();
  }
  function addAI(t){
    remT();wm.style.display='none';
    var d=document.createElement('div');d.className='msg ai';
    d.innerHTML='<div class="avatar ai">V</div><div class="bubble"></div>';
    ca.appendChild(d);sb();
    var b=d.querySelector('.bubble');type(b,t);speak(t);
  }
  function stripEm(s){
    return s.replace(/[\u{1F300}-\u{1F9FF}]|[\u2600-\u27BF}]|[\u{1F000}-\u{1FFFF}]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDD10-\uDDFF]/gu,'')
      .replace(/[\r\n]+/g,'，').replace(/[*#_~`>\[\]\(\)]/g,'').replace(/\s+/g,' ').trim();
  }
  function type(el,t,s){
    s=s||30;el.innerHTML='';var i=0;
    var c=document.createElement('span');c.className='typing-cursor';el.appendChild(c);
    function ty(){
      if(i<t.length){el.insertBefore(document.createTextNode(t[i]),c);i++;sb();setTimeout(ty,s)}
      else{c.remove()}
    }
    ty();
  }
  function speak(t){
    if(!sy)return;window.speechSynthesis.cancel();
    var cl=stripEm(t);if(!cl)return;
    var u=new SpeechSynthesisUtterance(cl);u.lang='zh-CN';u.rate=1.0;
    var vs=sy.getVoices();
    var ps=['Xiaoxiao','Xiaohan','Kangkang','Yunjian','Yunxi','Yunyang','Huihui'];
    var best=null;
    for(var i=0;i<ps.length;i++){best=vs.find(function(v){return v.lang.indexOf('zh')>=0&&v.name.indexOf(ps[i])>=0});if(best)break}
    if(!best)best=vs.find(function(v){return v.lang.indexOf('zh')>=0});
    if(best)u.voice=best;sy.speak(u);
  }
  
  function reply(input){
    var t=input.trim();
    
    if(t.match(/难过|伤心|哭|不开心|难受|低落|沮丧|心情不好/)){
      return '我理解你现在的心情。难过的時候不用强撑着，想哭就哭出来吧。给自己一点时间和空间，慢慢来，一切都会好起来的。我在这里陪着你。';
    }
    if(t.match(/考试|考砸|挂科|没考好|分数|成绩/)){
      return '考试结果不理想确实让人失落，但一次考试真的不能定义你的价值。人生有很多可能，这只是一个小小的弯道而已。你已经很努力了，先让自己喘口气，好好休息一下。';
    }
    if(t.match(/压力|焦虑|紧张|焦虑|不安|担心/)){
      return '压力大的时候，试试深呼吸：慢慢地吸气，在心里数到四，然后缓缓呼出，再数到四。重复几次。你不需要一下子解决所有问题，一步一步来就好。';
    }
    if(t.match(/挫折|失败|坚持不住|想放弃|太难了|好难|好累/)){
      return '每个人都会有觉得自己撑不下去的时刻，这不代表你不够好。你已经走了很远了，每一步都算数。休息一下不是放弃，是为了更好地继续。我为你骄傲。';
    }
    if(t.match(/加油|鼓励|坚持|努力/)){
      return '你真的很棒！不管现在遇到什么，你都在努力向前走。累了就休息，准备好了再出发。我一直在这里支持你，加油！';
    }
    if(t.match(/你好|hello|hi|您好/)){
      var h=new Date().getHours();
      var g=h<6?'夜深了':h<12?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';
      return g+'！我是语音AI，你可以问我天气、时间、旅游规划，也可以跟我说说你的心情，我一直在这里。';
    }
    if(t.match(/天气/)){
      var c=['晴','多云','小雨'][Math.floor(Math.random()*3)];
      var tn=Math.floor(Math.random()*12+22);
      return '今天是'+(new Date().getMonth()+1)+'月'+(new Date().getDate())+'日，天气'+c+'，温度'+tn+'摄氏度。'+(tn>30?'天气热注意防暑':'天气不错适合出门走走');
    }
    if(t.match(/时间|几点|日期/)){
      var n=new Date();var wk=['日','一','二','三','四','五','六'];
      return '现在是'+n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日星期'+wk[n.getDay()]+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    }
    if(t.match(/旅游|规划|行程|攻略/)){
      var cs=['北京','上海','成都','杭州','西安','三亚'];var dest=cs.find(function(c){return t.includes(c)})||'一个美丽的目的地';
      return '为你推荐'+dest+'三天两晚旅游计划：第一天抵达入住，品尝美食游览市区。第二天深度体验文化景点，特色购物。第三天自由活动后愉快返程。祝旅途愉快！';
    }
    if(t.match(/谢谢|感谢/))return '不客气，很高兴能帮到你。随时都可以找我聊天。';
    if(t.match(/再见|拜拜|晚安/))return '晚安，好好休息。明天又是新的一天，我会一直在这里。';
    
    return ['嗯，我听到了。如果你想聊聊，我在这里陪着你。','谢谢你和我说这些，你的感受很重要。想继续聊聊吗？','我在这里呢，不管你想说什么都可以告诉我。','嗯，我在听。有时候说出来就会觉得轻松一些。'][Math.floor(Math.random()*4)];
  }
  
  function handle(t){
    t=t.trim();if(!t||proc)return;
    proc=true;setStatus('think');
    addUser(t);showT();
    setTimeout(function(){
      addAI(reply(t));proc=false;setStatus('idle');
    },700+Math.random()*500);
  }
  function sendText(){
    var t=ti.value.trim();if(t){ti.value='';handle(t)}
  }
  function clearChat(){
    if(proc)return;window.speechSynthesis.cancel();
    ca.querySelectorAll('.msg').forEach(function(m){m.remove()});
    wm.style.display='flex';te=null;
  }
  window.ask=function(el){
    if(proc)return;handle(el.textContent.trim());
  };
  ti.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}
  });
  document.getElementById('sendBtn').addEventListener('click',sendText);
  document.getElementById('clearBtn').addEventListener('click',clearChat);
  mBtn.addEventListener('click',function(){
    if(lis){lis=false;try{rec.stop()}catch(e){};setStatus('idle')}else{
      try{rec.start();lis=true;ih.textContent='我在听，请说话...'}catch(e){ih.textContent='语音用不了，试试文字输入'}
    }
  });
  if(sy){sy.getVoices();sy.onvoiceschanged=function(){sy.getVoices()}}
  if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
  console.log('VoiceAI ready');
})();
</script>
</body>
</html>
